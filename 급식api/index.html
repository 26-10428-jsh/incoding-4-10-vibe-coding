<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 급식 - 자운고등학교</title>
    <!-- Flatpickr (Calendar Library) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="header-top">
                <span class="school-badge">자운고등학교</span>
            </div>
            <h1>오늘의 급식 🍽️</h1>
            
            <div class="date-selector">
                <button id="prev-day" class="icon-btn" aria-label="이전 날짜">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="date-display" id="calendar-trigger">
                    <input type="text" id="date-picker" class="hidden-input">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--primary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <h2 id="current-date-text">로딩 중...</h2>
                </div>
                <button id="next-day" class="icon-btn" aria-label="다음 날짜">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </header>

        <div id="loading-spinner" class="spinner-container">
            <div class="spinner"></div>
            <p>맛있는 식단을 불러오는 중...</p>
        </div>

        <div id="error-message" class="error-container hidden">
            <div class="error-icon">😕</div>
            <p id="error-text">급식 정보를 불러올 수 없습니다.</p>
        </div>

        <div id="meal-container" class="meal-grid hidden">
            <!-- Meal cards will be inserted here dynamically -->
        </div>

        <div class="allergy-legend">
            <h3>💡 알레르기 정보 안내</h3>
            <div class="legend-grid" id="allergy-legend-grid">
                <!-- Legend items will be generated by JS -->
            </div>
        </div>
    </main>

    <!-- Flatpickr (Calendar Library) JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <script src="app.js"></script>
</body>
</html>
